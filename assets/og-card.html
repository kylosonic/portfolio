<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahom Girma social card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
        }

        body {
            position: relative;
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 56px;
            padding: 64px 70px;
            background: #07140f;
            color: #f4f7f2;
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(61, 214, 148, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61, 214, 148, 0.06) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: linear-gradient(to right, black, transparent 72%);
        }

        .eyebrow,
        h1,
        .lead,
        .projects,
        .footer {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            margin: 0 0 24px;
            color: #52e4a7;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 92px;
            line-height: 0.92;
            letter-spacing: -0.055em;
        }

        .lead {
            max-width: 660px;
            margin: 28px 0 0;
            color: #c4cec8;
            font-size: 25px;
            line-height: 1.35;
        }

        .projects {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }

        .project {
            padding: 20px 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(10px);
        }

        .project strong {
            display: block;
            color: #52e4a7;
            font-size: 22px;
            line-height: 1.1;
            margin-bottom: 5px;
        }

        .project span {
            color: #aebbb4;
            font-size: 16px;
            line-height: 1.3;
        }

        .footer {
            position: absolute;
            left: 70px;
            bottom: 40px;
            color: #7f9187;
            font-size: 17px;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Software Engineer / Founder</p>
        <h1>Nahom<br>Girma</h1>
        <p class="lead">Full-stack, AI automation, and mobile products built end to end.</p>
        <p class="footer">nahomwoldemichael.vercel.app</p>
    </main>
    <aside class="projects" aria-label="Recent products">
        <div class="project">
            <strong>Nourish</strong>
            <span>Offline-first Ethiopian nutrition tracker</span>
        </div>
        <div class="project">
            <strong>FreightPilot</strong>
            <span>Logistics operations SaaS</span>
        </div>
        <div class="project">
            <strong>Stealth Overlay</strong>
            <span>AI workflows for boutique agencies</span>
        </div>
    </aside>
</body>
</html>
