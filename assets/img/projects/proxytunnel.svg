<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">ProxyTunnel mobile networking interface</title>
  <desc id="desc">A mobile device routes encrypted network traffic through a user-controlled proxy using SOCKS5, HTTP CONNECT, and DNS interception.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1712"/>
      <stop offset="1" stop-color="#17251f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24352d"/>
      <stop offset="1" stop-color="#111b17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45dc9c"/>
      <stop offset="1" stop-color="#1aa875"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#d8ffe9" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="1040" cy="80" r="220" fill="#33c88b" opacity=".08"/>
  <circle cx="170" cy="760" r="260" fill="#33c88b" opacity=".05"/>

  <g fill="none" stroke="#d9ffe9" stroke-opacity=".15">
    <rect x="38" y="38" width="1124" height="674" rx="30"/>
    <path d="M44 130h1112M44 618h1112"/>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="78" y="94" fill="#70e1b0" font-size="16" font-weight="650" letter-spacing="3">PROXYTUNNEL / PRIVATE NETWORK</text>
    <text x="78" y="196" fill="#f3faf6" font-size="64" font-weight="650" letter-spacing="-2.5">Your traffic.</text>
    <text x="78" y="261" fill="#f3faf6" font-size="64" font-weight="650" letter-spacing="-2.5">One controlled route.</text>
    <text x="82" y="320" fill="#aec4b9" font-size="21">A packet tunnel for iOS and Android, built around</text>
    <text x="82" y="350" fill="#aec4b9" font-size="21">SOCKS5, HTTP CONNECT, and private DNS handling.</text>
  </g>

  <g transform="translate(790 154)">
    <rect x="0" y="0" width="284" height="420" rx="46" fill="#0a0f0d" stroke="#64dcaa" stroke-opacity=".45" stroke-width="2"/>
    <rect x="16" y="18" width="252" height="384" rx="34" fill="url(#screen)"/>
    <rect x="104" y="29" width="76" height="8" rx="4" fill="#d7f8e8" opacity=".28"/>
    <circle cx="142" cy="103" r="38" fill="#1aa875" opacity=".2"/>
    <path d="M142 76l22 12v20c0 18-10 28-22 35-12-7-22-17-22-35V88l22-12Z" fill="url(#accent)" filter="url(#glow)"/>
    <path d="m133 107 7 7 13-16" fill="none" stroke="#07130e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="165" text-anchor="middle" fill="#f4faf7" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="650">Tunnel ready</text>
    <text x="142" y="192" text-anchor="middle" fill="#91ab9f" font-family="Inter, Segoe UI, sans-serif" font-size="13">Private route active</text>
    <g font-family="Inter, Segoe UI, sans-serif">
      <rect x="36" y="225" width="212" height="48" rx="12" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="52" y="245" fill="#8ea79b" font-size="10" letter-spacing="1.3">PROXY ENDPOINT</text>
      <text x="52" y="262" fill="#f2f8f4" font-size="14" font-weight="600">proxy.local:1080</text>
      <rect x="36" y="285" width="100" height="38" rx="10" fill="#ffffff" fill-opacity=".055"/>
      <text x="52" y="309" fill="#f2f8f4" font-size="13">SOCKS5</text>
      <rect x="148" y="285" width="100" height="38" rx="10" fill="#ffffff" fill-opacity=".055"/>
      <text x="164" y="309" fill="#f2f8f4" font-size="13">HTTP</text>
    </g>
    <rect x="36" y="345" width="212" height="42" rx="21" fill="url(#accent)"/>
    <text x="142" y="371" text-anchor="middle" fill="#07130e" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">CONNECTED</text>
  </g>

  <g transform="translate(610 272)">
    <circle cx="46" cy="46" r="42" fill="#13221b" stroke="#4bd59b" stroke-width="2"/>
    <path d="M28 57c17-25 42-23 40-4-2 16-23 24-40 4Z" fill="none" stroke="#7ee8b9" stroke-width="3"/>
    <path d="M26 46h42M46 17v58" fill="none" stroke="#7ee8b9" stroke-opacity=".55" stroke-width="2"/>
    <text x="46" y="112" text-anchor="middle" fill="#b8d3c6" font-family="IBM Plex Mono, Consolas, monospace" font-size="13">PROXY</text>
  </g>

  <path d="M650 318C680 318 706 318 744 318" fill="none" stroke="#43d698" stroke-width="3" stroke-dasharray="8 9"/>
  <path d="M300 515C425 515 495 367 610 318" fill="none" stroke="#43d698" stroke-width="3" stroke-dasharray="8 9"/>

  <g transform="translate(78 405)">
    <rect x="0" y="0" width="224" height="140" rx="22" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="18" y="18" width="188" height="76" rx="14" fill="#14251e"/>
    <circle cx="46" cy="56" r="15" fill="#258e67"/>
    <path d="M41 56h10m-5-5v10" stroke="#dffbed" stroke-width="2"/>
    <rect x="77" y="38" width="100" height="8" rx="4" fill="#d4f4e5" opacity=".75"/>
    <rect x="77" y="56" width="72" height="7" rx="3.5" fill="#d4f4e5" opacity=".28"/>
    <rect x="77" y="72" width="112" height="7" rx="3.5" fill="#d4f4e5" opacity=".18"/>
    <text x="18" y="123" fill="#92af9f" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">ENCRYPTED FLOW ACTIVE</text>
  </g>

  <g transform="translate(78 586)" font-family="IBM Plex Mono, Consolas, monospace">
    <text x="0" y="16" fill="#6fe0af" font-size="12" letter-spacing="1.1">01 / SOCKS5</text>
    <text x="190" y="16" fill="#6fe0af" font-size="12" letter-spacing="1.1">02 / DNS</text>
    <text x="360" y="16" fill="#6fe0af" font-size="12" letter-spacing="1.1">03 / PACKET TUNNEL</text>
    <text x="0" y="45" fill="#a8c2b5" font-size="13">Stream routing</text>
    <text x="190" y="45" fill="#a8c2b5" font-size="13">Interception</text>
    <text x="360" y="45" fill="#a8c2b5" font-size="13">IPv4 + IPv6</text>
  </g>
</svg>
